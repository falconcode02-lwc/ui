<nz-page-header class="page-action">
  <nz-page-header-title><nz-icon nzType="safety" nzTheme="outline"></nz-icon> Role Management</nz-page-header-title>
  <nz-page-header-subtitle>
    <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
      <input type="text" (input)="search()" [(ngModel)]="searchText" nz-input placeholder="Search roles..." />
    </nz-input-group>
    <ng-template #suffixIconButton>
      <button nz-button nzType="primary" (click)="search()" nzSearch> <nz-icon nzType="search"></nz-icon></button>
    </ng-template>
  </nz-page-header-subtitle>
  <nz-page-header-extra>
    <nz-space>
      <button *nzSpaceItem nz-button nzType="default" nzShape="round" (click)="loadRoles()">
        <i nz-icon nzType="reload"></i> Refresh
      </button>
      <button *nzSpaceItem nz-button nzType="default" nzShape="round" (click)="openCreate()">
        <i nz-icon nzType="plus"></i> New
      </button>
    </nz-space>
  </nz-page-header-extra>
</nz-page-header>

<div class="role-list">
  <!-- Empty State -->
  <nz-empty *ngIf="!loading && filteredRoles.length === 0" nzNotFoundContent="No roles found">
    <button nz-button nzType="primary" (click)="openCreate()">
      <i nz-icon nzType="plus"></i> Create Role
    </button>
  </nz-empty>

  <!-- List View -->
  <nz-list *ngIf="filteredRoles.length > 0" [nzDataSource]="filteredRoles" [nzLoading]="loading" >
    <nz-list-item *ngFor="let role of filteredRoles" class="role-item">
      <div class="role-content">
        <div class="role-main" (click)="openEdit(role)">
          <nz-icon nzType="safety" nzTheme="outline" class="role-icon"></nz-icon>
          <div class="role-details">
            <div class="role-name">{{ role.roleName }}</div>
            <div class="role-meta">
              <span class="meta-item" *ngIf="role.description">
                <span class="meta-label">Description:</span> {{ role.description }}
              </span>
              <span class="meta-item">
                <span class="meta-label" *ngIf="role.description">|</span> 
                <span class="meta-label">Permissions:</span> {{ getPermissionsSummary(role) }}
              </span>
              <span class="meta-item">
                <span class="meta-label">|</span> Created <small><i>{{ role.createdAt | date:'MMM d, y, h:mm a' }}</i></small>
              </span>
            </div>
          </div>
        </div>
        <div class="role-actions">
          <button nz-button nzType="text" nz-dropdown [nzDropdownMenu]="menu" nzPlacement="bottomRight"
            (click)="$event.stopPropagation()">
            <nz-icon nzType="more" nzTheme="outline"></nz-icon>
          </button>
          <nz-dropdown-menu #menu="nzDropdownMenu">
            <ul nz-menu>
              <li nz-menu-item (click)="openEdit(role)">
                <nz-icon nzType="edit" nzTheme="outline"></nz-icon>
                Edit
              </li>
              <li nz-menu-item nzDanger 
                  nz-popconfirm 
                  nzPopconfirmTitle="Are you sure you want to delete this role?"
                  (nzOnConfirm)="deleteRole(role)">
                <nz-icon nzType="delete" nzTheme="outline"></nz-icon>
                Delete
              </li>
            </ul>
          </nz-dropdown-menu>
        </div>
      </div>
    </nz-list-item>
  </nz-list>
</div>

<nz-modal 
  [(nzVisible)]="isModalVisible" 
  [nzTitle]="isEditing ? 'Edit Role' : 'Create New Role'" 
  (nzOnCancel)="handleCancel()" 
  (nzOnOk)="handleOk()"
  [nzWidth]="720">
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="roleForm" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label [nzRequired]="true">Role Name</nz-form-label>
        <nz-form-control nzErrorTip="Please input role name (max 100 characters)!">
          <input nz-input formControlName="roleName" placeholder="Enter role name (e.g., ADMIN, EDITOR, VIEWER)" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Description</nz-form-label>
        <nz-form-control nzErrorTip="Description is too long (max 2000 characters)!">
          <textarea nz-input formControlName="description" placeholder="Enter role description" rows="3"></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-divider nzText="Permissions Configuration"></nz-divider>

      <!-- Global Select All Actions -->
      <div style="margin-bottom: 16px; display: flex; gap: 8px; justify-content: flex-end;">
        <button nz-button nzType="default" nzSize="small" (click)="selectAllPermissions()">
          <nz-icon nzType="check-square" nzTheme="outline"></nz-icon> Select All
        </button>
        <button nz-button nzType="default" nzSize="small" (click)="clearAllPermissions()">
          <nz-icon nzType="close-square" nzTheme="outline"></nz-icon> Clear All
        </button>
      </div>

      <!-- Workspace Permissions -->
      <nz-card nzTitle="Workspace" []="true" class="permission-card">
        <div class="permission-header">
          <label nz-checkbox 
                 [ngModel]="isAllWorkspaceSelected()" 
                 (ngModelChange)="toggleAllWorkspace()"
                 [ngModelOptions]="{standalone: true}"
                 class="select-all-checkbox">
            <strong>Select All Workspace Permissions</strong>
          </label>
        </div>
        <div class="permission-grid">
          <label nz-checkbox [(ngModel)]="permissions.workspace!.view" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="eye" nzTheme="outline"></nz-icon> View
          </label>
          <label nz-checkbox [(ngModel)]="permissions.workspace!.edit" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="edit" nzTheme="outline"></nz-icon> Edit
          </label>
        </div>
      </nz-card>

      <!-- Project Permissions -->
      <nz-card nzTitle="Project" []="true" class="permission-card">
        <div class="permission-header">
          <label nz-checkbox 
                 [ngModel]="isAllProjectSelected()" 
                 (ngModelChange)="toggleAllProject()"
                 [ngModelOptions]="{standalone: true}"
                 class="select-all-checkbox">
            <strong>Select All Project Permissions</strong>
          </label>
        </div>
        <div class="permission-grid">
          <label nz-checkbox [(ngModel)]="permissions.project!.view" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="eye" nzTheme="outline"></nz-icon> View
          </label>
          <label nz-checkbox [(ngModel)]="permissions.project!.edit" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="edit" nzTheme="outline"></nz-icon> Edit
          </label>
          <label nz-checkbox [(ngModel)]="permissions.project!.delete" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="delete" nzTheme="outline"></nz-icon> Delete
          </label>
        </div>
      </nz-card>

      <!-- Workflow Permissions -->
      <nz-card nzTitle="Workflow" []="true" class="permission-card">
        <div class="permission-header">
          <label nz-checkbox 
                 [ngModel]="isAllWorkflowSelected()" 
                 (ngModelChange)="toggleAllWorkflow()"
                 [ngModelOptions]="{standalone: true}"
                 class="select-all-checkbox">
            <strong>Select All Workflow Permissions</strong>
          </label>
        </div>
        <div class="permission-grid">
          <label nz-checkbox [(ngModel)]="permissions.workflow!.view" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="eye" nzTheme="outline"></nz-icon> View
          </label>
          <label nz-checkbox [(ngModel)]="permissions.workflow!.edit" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="edit" nzTheme="outline"></nz-icon> Edit
          </label>
          <label nz-checkbox [(ngModel)]="permissions.workflow!.create" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="plus-circle" nzTheme="outline"></nz-icon> Create
          </label>
          <label nz-checkbox [(ngModel)]="permissions.workflow!.transfer" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="swap" nzTheme="outline"></nz-icon> Transfer
          </label>
          <label nz-checkbox [(ngModel)]="permissions.workflow!.delete" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="delete" nzTheme="outline"></nz-icon> Delete
          </label>
        </div>
      </nz-card>

      <!-- Plugin Permissions -->
      <nz-card nzTitle="Plugin" []="true" class="permission-card">
        <div class="permission-header">
          <label nz-checkbox 
                 [ngModel]="isAllPluginSelected()" 
                 (ngModelChange)="toggleAllPlugin()"
                 [ngModelOptions]="{standalone: true}"
                 class="select-all-checkbox">
            <strong>Select All Plugin Permissions</strong>
          </label>
        </div>
        <div class="permission-grid">
          <label nz-checkbox [(ngModel)]="permissions.plugin!.view" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="eye" nzTheme="outline"></nz-icon> View
          </label>
          <label nz-checkbox [(ngModel)]="permissions.plugin!.edit" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="edit" nzTheme="outline"></nz-icon> Edit
          </label>
          <label nz-checkbox [(ngModel)]="permissions.plugin!.deploy" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="cloud-upload" nzTheme="outline"></nz-icon> Deploy
          </label>
          <label nz-checkbox [(ngModel)]="permissions.plugin!.delete" [ngModelOptions]="{standalone: true}">
            <nz-icon nzType="delete" nzTheme="outline"></nz-icon> Delete
          </label>
        </div>
      </nz-card>
    </form>
  </ng-container>
</nz-modal>
