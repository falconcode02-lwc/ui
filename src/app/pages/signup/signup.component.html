<div class="signup-container">
  <!-- Animated Workflow Background -->
  <div class="workflow-animation">
    <!-- Workflow Nodes -->
    <div class="workflow-node node-1">
      <div class="node-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M8 12L11 15L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="workflow-node node-2">
      <div class="node-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="workflow-node node-3">
      <div class="node-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="workflow-node node-4">
      <div class="node-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="workflow-node node-5">
      <div class="node-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M12 1V5M12 19V23M23 12H19M5 12H1M20.49 20.49L17.66 17.66M6.34 6.34L3.51 3.51M20.49 3.51L17.66 6.34M6.34 17.66L3.51 20.49" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Connection Lines -->
    <svg class="workflow-connections" viewBox="0 0 1000 800" preserveAspectRatio="none">
      <defs>
        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(24, 144, 255, 0)" />
          <stop offset="50%" stop-color="rgba(24, 144, 255, 0.6)" />
          <stop offset="100%" stop-color="rgba(24, 144, 255, 0)" />
        </linearGradient>
      </defs>
      <path class="connection line-1" d="M 150 200 Q 300 150 450 200" stroke="url(#lineGradient)" stroke-width="2" fill="none"/>
      <path class="connection line-2" d="M 450 200 Q 600 250 750 200" stroke="url(#lineGradient)" stroke-width="2" fill="none"/>
      <path class="connection line-3" d="M 150 200 Q 200 400 350 500" stroke="url(#lineGradient)" stroke-width="2" fill="none"/>
      <path class="connection line-4" d="M 450 200 Q 500 350 550 500" stroke="url(#lineGradient)" stroke-width="2" fill="none"/>
      <path class="connection line-5" d="M 750 200 Q 700 350 650 500" stroke="url(#lineGradient)" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <!-- Left Side - Branding -->
  <div class="signup-branding">
    <div class="branding-content">
      <div class="logo-section">
        <div class="logo-icon">
          <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 5L55 17.5V42.5L30 55L5 42.5V17.5L30 5Z" stroke="url(#gradient)" stroke-width="3" fill="none"/>
            <path d="M30 15L45 22.5V37.5L30 45L15 37.5V22.5L30 15Z" fill="url(#gradient)" opacity="0.3"/>
            <circle cx="30" cy="30" r="8" fill="url(#gradient)"/>
            <defs>
              <linearGradient id="gradient" x1="5" y1="5" x2="55" y2="55" gradientUnits="userSpaceOnUse">
                <stop stop-color="#1890ff"/>
                <stop offset="1" stop-color="#722ed1"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand-name">Falcon Flow</h1>
        <p class="brand-tagline">Join the Workflow Revolution</p>
      </div>
      
      <div class="features-list">
        <div class="feature-item">
          <nz-icon nzType="check-circle" nzTheme="fill"></nz-icon>
          <span>Free Account Setup</span>
        </div>
        <div class="feature-item">
          <nz-icon nzType="check-circle" nzTheme="fill"></nz-icon>
          <span>Instant Access</span>
        </div>
        <div class="feature-item">
          <nz-icon nzType="check-circle" nzTheme="fill"></nz-icon>
          <span>No Credit Card Required</span>
        </div>
        <div class="feature-item">
          <nz-icon nzType="check-circle" nzTheme="fill"></nz-icon>
          <span>24/7 Support</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side - Signup Form -->
  <div class="signup-form-section">
    <div class="signup-form-container">
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Start your workflow automation journey</p>
      </div>

      <!-- Success Alert -->
      <nz-alert 
        *ngIf="successMessage" 
        nzType="success" 
        [nzMessage]="successMessage" 
        [nzShowIcon]="true"
        class="signup-alert">
      </nz-alert>

      <!-- Error Alert -->
      <nz-alert 
        *ngIf="errorMessage" 
        nzType="error" 
        [nzMessage]="errorMessage" 
        [nzShowIcon]="true"
        [nzCloseable]="true"
        (nzOnClose)="errorMessage = ''"
        class="signup-alert">
      </nz-alert>

      <form nz-form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
        <nz-form-item>
          <nz-form-control nzErrorTip="Please input your full name!">
            <nz-input-group nzSize="large" [nzPrefix]="userPrefix">
              <input 
                nz-input 
                class="signup-input"
                formControlName="fullName" 
                placeholder="Full Name"
                [disabled]="loading" />
            </nz-input-group>
            <ng-template #userPrefix>
              <nz-icon nzType="user" nzTheme="outline"></nz-icon>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Please input a valid username (min 3 characters)!">
            <nz-input-group nzSize="large" [nzPrefix]="idcardPrefix">
              <input 
                nz-input 
                class="signup-input"
                formControlName="username" 
                placeholder="Username"
                [disabled]="loading" />
            </nz-input-group>
            <ng-template #idcardPrefix>
              <nz-icon nzType="idcard" nzTheme="outline"></nz-icon>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Please input a valid email!">
            <nz-input-group nzSize="large" [nzPrefix]="mailPrefix">
              <input 
                nz-input 
                class="signup-input"
                type="email"
                formControlName="email" 
                placeholder="Email Address"
                [disabled]="loading" />
            </nz-input-group>
            <ng-template #mailPrefix>
              <nz-icon nzType="mail" nzTheme="outline"></nz-icon>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Password must be at least 6 characters!">
            <nz-input-group nzSize="large" [nzPrefix]="lockPrefix">
              <input 
                nz-input 
                class="signup-input"
                type="password" 
                formControlName="password"
                placeholder="Password (min 6 characters)"
                [disabled]="loading" />
            </nz-input-group>
            <ng-template #lockPrefix>
              <nz-icon nzType="lock" nzTheme="outline"></nz-icon>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Please confirm your password!">
            <nz-input-group nzSize="large" [nzPrefix]="lockPrefix2">
              <input 
                nz-input 
                class="signup-input"
                type="password" 
                formControlName="confirmPassword"
                placeholder="Confirm Password"
                [disabled]="loading" />
            </nz-input-group>
            <ng-template #lockPrefix2>
              <nz-icon nzType="lock" nzTheme="outline"></nz-icon>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <div class="terms-checkbox">
          <label nz-checkbox formControlName="agreeToTerms">
            I agree to the <a>Terms of Service</a> and <a>Privacy Policy</a>
          </label>
        </div>

        <button 
          nz-button 
          nzType="primary" 
          nzSize="large"
          nzBlock
          [nzLoading]="loading"
          [disabled]="signupForm.invalid"
          class="signup-button">
          <span *ngIf="!loading">Create Account</span>
          <span *ngIf="loading">Creating Account...</span>
        </button>
      </form>

      <div class="form-footer">
        <p>Already have an account? <a (click)="navigateToLogin()">Sign In</a></p>
      </div>
    </div>
  </div>
</div>
